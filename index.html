    <script>
        const app = {

                {

                },
                {

                {

                }
            ],
            tasks: [
                { id: 1, title: 'Screen 50 applications for DevOps role', assignedTo: 'RecruiterAI', priority: 'high', status: 'in-progress', dueDate: '2024-01-15' },
                { id: 2, title: 'Schedule 8 interviews for next week', assignedTo: 'RecruiterAI', priority: 'medium', status: 'pending', dueDate: '2024-01-12' },
                { id: 3, title: 'Process new hire paperwork (5 employees)', assignedTo: 'OnboardingBot', priority: 'high', status: 'in-progress', dueDate: '2024-01-10' },
                { id: 4, title: 'Run monthly payroll (450 employees)', assignedTo: 'PayrollPro', priority: 'critical', status: 'in-progress', dueDate: '2024-01-05' },
                { id: 5, title: 'Generate Q4 performance reports', assignedTo: 'PerformanceTracker', priority: 'high', status: 'in-progress', dueDate: '2024-01-08' },
                { id: 6, title: 'Analyze employee engagement survey', assignedTo: 'CultureKeeper', priority: 'medium', status: 'completed', dueDate: '2024-01-03' },
                { id: 7, title: 'Update compliance documentation', assignedTo: 'ComplianceGuard', priority: 'high', status: 'in-progress', dueDate: '2024-01-20' },
                { id: 8, title: 'Launch Q1 training programs', assignedTo: 'TrainingMentor', priority: 'medium', status: 'pending', dueDate: '2024-01-25' },
                { id: 9, title: 'Review retention metrics', assignedTo: 'ExitAnalyst', priority: 'low', status: 'completed', dueDate: '2024-01-02' },
                { id: 10, title: 'Coordinate benefits enrollment', assignedTo: 'PayrollPro', priority: 'medium', status: 'pending', dueDate: '2024-01-18' }
            ],
            chatMessages: [],

            init() {
                this.loadFromStorage();
                this.showView('dashboard');
                this.startAgentSimulation();
            },

            loadFromStorage() {
                const stored = localStorage.getItem('hrDreamTeam');
                if (stored) {
                    const data = JSON.parse(stored);
                    this.tasks = data.tasks || this.tasks;
                    this.chatMessages = data.chatMessages || [];
                }
            },

            saveToStorage() {
                localStorage.setItem('hrDreamTeam', JSON.stringify({
                    tasks: this.tasks,
                    chatMessages: this.chatMessages
                }));
            },

            showView(view) {
                this.currentView = view;
                const content = document.getElementById('mainContent');
                
                switch(view) {
                    case 'dashboard':
                        content.innerHTML = this.renderDashboard();
                        break;
                    case 'agents':
                        content.innerHTML = this.renderAgents();
                        break;
                    case 'tasks':
                        content.innerHTML = this.renderTasks();
                        break;
                    case 'chat':
                        content.innerHTML = this.renderChat();
                        setTimeout(() => this.scrollChatToBottom(), 100);
                        break;
                }
            },

            renderDashboard() {
                const totalTasks = this.tasks.length;
                const completedTasks = this.tasks.filter(t => t.status === 'completed').length;
                const inProgressTasks = this.tasks.filter(t => t.status === 'in-progress').length;
                const avgEfficiency = Math.round(this.agents.reduce((sum, a) => sum + a.efficiency, 0) / this.agents.length);

                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="metric-card glass rounded-xl p-6 shadow-lg">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Active Agents</p>
                                    <p class="text-3xl font-bold mt-2">${this.agents.length}</p>
                                </div>
                                <div class="text-4xl">🤖</div>
                            </div>
                        </div>
                        <div class="metric-card glass rounded-xl p-6 shadow-lg">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Tasks Completed</p>
                                    <p class="text-3xl font-bold mt-2">${completedTasks}/${totalTasks}</p>
                                </div>
                                <div class="text-4xl">✅</div>
                            </div>
                        </div>
                        <div class="metric-card glass rounded-xl p-6 shadow-lg">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">In Progress</p>
                                    <p class="text-3xl font-bold mt-2">${inProgressTasks}</p>
                                </div>
                                <div class="text-4xl">⚡</div>
                            </div>
                        </div>
                        <div class="metric-card glass rounded-xl p-6 shadow-lg">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Avg Efficiency</p>
                                    <p class="text-3xl font-bold mt-2">${avgEfficiency}%</p>
                                </div>
                                <div class="text-4xl">📈</div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="glass rounded-xl p-6 shadow-lg">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <span>🎯</span> Active Tasks
                            </h2>
                            <div class="space-y-3 max-h-96 overflow-y-auto">
                                ${this.tasks.filter(t => t.status !== 'completed').slice(0, 5).map(task => `
                                    <div class="task-item glass rounded-lg p-4 cursor-pointer" onclick="app.showView('tasks')">
                                        <div class="flex justify-between items-start mb-2">
                                            <h3 class="font-semibold text-white">${task.title}</h3>
                                            <span class="px-2 py-1 rounded text-xs ${
                                                task.priority === 'critical' ? 'bg-red-500/20 text-red-400' :
                                                task.priority === 'high' ? 'bg-orange-500/20 text-orange-400' :
                                                task.priority === 'medium' ? 'bg-yellow-500/20 text-yellow-400' :
                                                'bg-green-500/20 text-green-400'
                                            }">${task.priority}</span>
                                        </div>
                                        <p class="text-sm text-slate-400">Assigned to: ${task.assignedTo}</p>
                                        <p class="text-xs text-slate-500 mt-1">Due: ${task.dueDate}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="glass rounded-xl p-6 shadow-lg">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <span>👥</span> Top Performers
                            </h2>
                            <div class="space-y-4">
                                ${this.agents.sort((a, b) => b.efficiency - a.efficiency).slice(0, 5).map(agent => `
                                    <div class="flex items-center justify-between p-4 glass rounded-lg">
                                        <div class="flex items-center gap-3">
                                            <div class="text-3xl">${agent.avatar}</div>
                                            <div>
                                                <h3 class="font-semibold text-white">${agent.name}</h3>
                                                <p class="text-xs text-slate-400">${agent.role}</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-2xl font-bold text-blue-400">${agent.efficiency}%</p>
                                            <p class="text-xs text-slate-400">${agent.tasksCompleted} tasks</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            renderAgents() {
                return `
                    <div class="mb-6">
                        <h2 class="text-3xl font-bold mb-2">AI Agent Team</h2>
                        <p class="text-slate-400">Your complete HR automation workforce</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${this.agents.map(agent => `
                            <div class="agent-card glass rounded-xl p-6 shadow-lg">
                                <div class="flex items-start justify-between mb-4">
                                    <div class="text-5xl">${agent.avatar}</div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-green-400 status-online"></span>
                                        <span class="text-xs text-green-400">Online</span>
                                    </div>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-1">${agent.name}</h3>
                                <p class="text-sm text-blue-400 mb-3">${agent.role}</p>
                                <p class="text-xs text-slate-400 mb-4 line-clamp-2">${agent.specialty}</p>
                                
                                <div class="glass rounded-lg p-3 mb-4">
                                    <p class="text-xs text-slate-300 mb-2">Current Task:</p>
                                    <p class="text-sm text-white">${agent.activeTask}</p>
                                </div>

                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-xs text-slate-400">Efficiency</p>
                                        <p class="text-lg font-bold text-green-400">${agent.efficiency}%</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-slate-400">Completed</p>
                                        <p class="text-lg font-bold text-blue-400">${agent.tasksCompleted}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            renderTasks() {
                return `
                    <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-3xl font-bold mb-2">Task Management</h2>
                            <p class="text-slate-400">Monitor and manage all HR tasks</p>
                        </div>
                        <button onclick="app.addNewTask()" class="btn-primary px-6 py-3 rounded-lg font-semibold shadow-lg">
                            + Add New Task
                        </button>
                    </div>

                    <div class="glass rounded-xl p-6 shadow-lg mb-6">
                        <div class="flex gap-3 mb-6 flex-wrap">
                            <button onclick="app.filterTasks('all')" class="px-4 py-2 rounded-lg glass hover:bg-blue-500/20 transition">All</button>
                            <button onclick="app.filterTasks('pending')" class="px-4 py-2 rounded-lg glass hover:bg-yellow-500/20 transition">Pending</button>
                            <button onclick="app.filterTasks('in-progress')" class="px-4 py-2 rounded-lg glass hover:bg-blue-500/20 transition">In Progress</button>
                            <button onclick="app.filterTasks('completed')" class="px-4 py-2 rounded-lg glass hover:bg-green-500/20 transition">Completed</button>
                        </div>

                        <div class="space-y-3" id="taskList">
                            ${this.tasks.map(task => `
                                <div class="task-item glass rounded-lg p-4">
                                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-3 mb-2">
                                                <input type="checkbox" ${task.status === 'completed' ? 'checked' : ''} 
                                                    onchange="app.toggleTaskStatus(${task.id})"
                                                    class="w-5 h-5 rounded" aria-label="Mark task as completed">
                                                <h3 class="font-semibold text-white ${task.status === 'completed' ? 'line-through opacity-60' : ''}">${task.title}</h3>
                                            </div>
                                            <div class="flex flex-wrap gap-2 text-sm text-slate-400 ml-8">
                                                <span>👤 ${task.assignedTo}</span>
                                                <span>📅 ${task.dueDate}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="px-3 py-1 rounded-full text-xs ${
                                                task.priority === 'critical' ? 'bg-red-500/20 text-red-400' :
                                                task.priority === 'high' ? 'bg-orange-500/20 text-orange-400' :
                                                task.priority === 'medium' ? 'bg-yellow-500/20 text-yellow-400' :
                                                'bg-green-500/20 text-green-400'
                                            }">${task.priority}</span>
                                            <span class="px-3 py-1 rounded-full text-xs ${
                                                task.status === 'completed' ? 'bg-green-500/20 text-green-400' :
                                                task.status === 'in-progress' ? 'bg-blue-500/20 text-blue-400' :
                                                'bg-slate-500/20 text-slate-400'
                                            }">${task.status}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            renderChat() {
                return `
                    <div class="glass rounded-xl shadow-lg overflow-hidden max-w-4xl mx-auto" style="height: calc(100vh - 200px);">
                        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-4">
                            <h2 class="text-2xl font-bold flex items-center gap-2">
                                <span>💬</span> Team Chat
                            </h2>
                            <p class="text-blue-100 text-sm mt-1">Communicate with your AI agents</p>
                        </div>
                        
                        <div id="chatMessages" class="p-6 overflow-y-auto space-y-4" style="height: calc(100% - 180px);">
                            ${this.chatMessages.length === 0 ? `
                                <div class="text-center text-slate-400 py-12">
                                    <p class="text-5xl mb-4">👋</p>
                                    <p>No messages yet. Start a conversation with your HR team!</p>
                                </div>
                            ` : this.chatMessages.map(msg => `
                                <div class="chat-message flex ${msg.sender === 'You' ? 'justify-end' : 'justify-start'}">
                                    <div class="max-w-xs md:max-w-md">
                                        <div class="flex items-center gap-2 mb-1 ${msg.sender === 'You' ? 'justify-end' : ''}">
                                            <span class="text-sm font-semibold ${msg.sender === 'You' ? 'text-blue-400' : 'text-purple-400'}">${msg.sender}</span>
                                            <span class="text-xs text-slate-500">${msg.time}</span>
                                        </div>
                                        <div class="${msg.sender === 'You' ? 'bg-blue-600' : 'glass'} rounded-lg p-3">
                                            <p class="text-sm text-white">${msg.text}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="p-4 border-t border-slate-700">
                            <div class="flex gap-3">
                                <input 
                                    type="text" 
                                    id="chatInput"
                                    placeholder="Type your message..."
                                    class="flex-1 bg-slate-800 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    onkeypress="if(event.key === 'Enter') app.sendMessage()"
                                    aria-label="Chat message input">
                                <button onclick="app.sendMessage()" class="btn-primary px-6 py-3 rounded-lg font-semibold shadow-lg">
                                    Send
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            toggleTaskStatus(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) {
                    task.status = task.status === 'completed' ? 'in-progress' : 'completed';
                    this.saveToStorage();
                    this.showView('tasks');
                }
            },

            filterTasks(filter) {
                const taskList = document.getElementById('taskList');
                let filtered = this.tasks;
                
                if (filter !== 'all') {
                    filtered = this.tasks.filter(t => t.status === filter);
                }

                taskList.innerHTML = filtered.map(task => `
                    <div class="task-item glass rounded-lg p-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <input type="checkbox" ${task.status === 'completed' ? 'checked' : ''} 
                                        onchange="app.toggleTaskStatus(${task.id})"
                                        class="w-5 h-5 rounded" aria-label="Mark task as completed">
                                    <h3 class="font-semibold text-white ${task.status === 'completed' ? 'line-through opacity-60' : ''}">${task.title}</h3>
                                </div>
                                <div class="flex flex-wrap gap-2 text-sm text-slate-400 ml-8">
                                    <span>👤 ${task.assignedTo}</span>
                                    <span>📅 ${task.dueDate}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 rounded-full text-xs ${
                                    task.priority === 'critical' ? 'bg-red-500/20 text-red-400' :
                                    task.priority === 'high' ? 'bg-orange-500/20 text-orange-400' :
                                    task.priority === 'medium' ? 'bg-yellow-500/20 text-yellow-400' :
                                    'bg-green-500/20 text-green-400'
                                }">${task.priority}</span>
                                <span class="px-3 py-1 rounded-full text-xs ${
                                    task.status === 'completed' ? 'bg-green-500/20 text-green-400' :
                                    task.status === 'in-progress' ? 'bg-blue-500/20 text-blue-400' :
                                    'bg-slate-500/20 text-slate-400'
                                }">${task.status}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            addNewTask() {
                const taskTitles = [
                    'Review benefits enrollment changes',
                    'Process background checks for new hires',
                    'Update employee training materials',
                    'Conduct salary benchmarking analysis',
                    'Organize team building event',
                    'Review and update job descriptions',
                    'Process leave requests for next month'
                ];
                const priorities = ['low', 'medium', 'high'];
                const statuses = ['pending', 'in-progress'];
                
                const newTask = {
                    id: this.tasks.length + 1,
                    title: taskTitles[Math.floor(Math.random() * taskTitles.length)],
                    assignedTo: this.agents[Math.floor(Math.random() * this.agents.length)].name,
                    priority: priorities[Math.floor(Math.random() * priorities.length)],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    dueDate: new Date(Date.now() + Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                };
                
                this.tasks.unshift(newTask);
                this.saveToStorage();
                this.showView('tasks');
            },

            sendMessage() {
